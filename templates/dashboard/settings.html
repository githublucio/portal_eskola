{% extends "dashboard/base.html" %}

{% block dashboard_title %}Konfigurasaun{% endblock %}

{% block dashboard_content %}
<h1 class="h3 mb-4">Konfigurasaun eskola</h1>
<form method="post" enctype="multipart/form-data" class="info-panel">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-accent" type="submit">Rai</button>
</form>
{% endblock %}
